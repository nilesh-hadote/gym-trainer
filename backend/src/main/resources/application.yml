server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: nilesh-hatode-fitness-backend

  datasource:
    url: jdbc:h2:mem:fitnessdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

jwt:
  secret: 9a6e8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a
  expiration-ms: 86400000 # 24 hours

razorpay:
  key-id: rzp_test_placeholder_id
  key-secret: rzp_test_placeholder_secret

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
